name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # The suites print Chinese; a hosted runner's stdout is a pipe, so Python
    # would encode it as cp1252 and die on the first non-ASCII print.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy sherpa-onnx sounddevice pystray pillow pyperclip

      # Each gate is its own step so a failure names the gate in the UI.
      # The full pipeline selftest needs the ASR model, which is not in the
      # repo (2GB); compile + i18n + icon gates run everywhere, the model
      # roundtrip runs only where asr-modules/ exists (local machine).
      - name: Compile check
        # src/updater.py was DELETED by the B5 template swap (9cf285f) but stayed in this
        # list, so `py_compile` failed on a missing file and this workflow has been red on
        # every push since - unnoticed because only the tag-triggered release workflow was
        # watched. The module that REPLACED it is listed instead.
        run: python -m py_compile src/main.py src/pipeline.py src/modules/i18n/i18n.py src/icons.py src/modules/update_helper/update_helper.py src/keyboard_hook.py src/wasapi_probe.py src/modules/appconfig/appconfig.py src/modules/paths/paths.py src/modules/log_kit/log_kit.py src/modules/autostart/autostart.py src/modules/tray_kit/tray_kit.py

      # GATE 2d from build.bat, run here as well. It needs no ASR model, and until now the
      # only thing that ran it was the tag-triggered release workflow - which is exactly why
      # an environment-dependent failure inside it stayed invisible until a release was cut
      # and then blocked that release. On failure it emits `::error::` annotations carrying
      # the bat's captured stdout/stderr, the update log and an @echo on trace, so the
      # evidence is readable without signing in to the run's logs.
      - name: Update chain safety (GATE 2d)
        run: python tests/test_update_safety.py

      # The gates after GATE 2d, one step each so a failure names the gate in the UI.
      # They use stubs and redirect their data root, so they need no ASR model - and
      # until now they ran ONLY inside build.bat (i.e. only in the tag-triggered
      # release workflow). GATE 2d failing first had been masking them on CI.
      - name: Quit decision (GATE 2e)
        run: python tests/test_quit_failopen.py

      - name: Engine model dir (GATE 2f)
        run: python tests/test_engine_model_dir.py

      - name: Main-side model dir (GATE 2g)
        run: python tests/test_main_model_dir.py

      - name: Update poll matcher (GATE 2h)
        run: python tests/test_poll_matcher.py

      - name: Delete-guard wiring (GATE 2i)
        run: python tests/test_delete_guard_wired.py

      - name: i18n coverage
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from modules import i18n; i18n.init('zh'); assert i18n.t('menu_quit')!='menu_quit'; assert i18n.t('menu_open_logs')=='打开日志目录'; i18n.init('en'); assert i18n.t('menu_quit')=='Quit'; assert i18n.t('menu_open_logs')=='Open log folder'; print('i18n OK')"

      - name: Icon generation
        run: python src/icons.py

      - name: Pipeline selftest (only when models are present)
        shell: pwsh
        run: |
          if (Test-Path "asr-modules/sensevoice-small-int8/model.int8.onnx") {
            python src/pipeline.py
          } else {
            Write-Host "asr-modules/ not in CI checkout - skipping ASR roundtrip"
          }
