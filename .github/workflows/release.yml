name: release

# Tag a commit and this builds the Windows package, verifies it, and attaches
# it to a GitHub Release. release.bat does the tagging.
#
#   * tag push -> build, verify, and PUBLISH a GitHub Release
#   * manual   -> build and upload the artifact only, never publish
#
# run-name makes the difference visible in the Actions list.

run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('release {0}', github.ref_name) || 'build only (no release)' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Models (~2.3GB) are not in git. Download the two int8 models the app
      # needs so the packaged smoke test does a real ASR roundtrip in CI.
      - name: Download ASR models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $sv = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          Invoke-WebRequest -Uri $sv -OutFile sv.tar.bz2
          tar -xjf sv.tar.bz2
          New-Item -ItemType Directory -Force -Path models/sensevoice-small-int8 | Out-Null
          Copy-Item sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx models/sensevoice-small-int8/
          Copy-Item sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt models/sensevoice-small-int8/
          # test clip for the pipeline-selftest gate (ships with the SV package)
          Copy-Item sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/test_wavs/zh.wav models/test_zh.wav
          $qwen = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2"
          Invoke-WebRequest -Uri $qwen -OutFile qwen.tar.bz2
          tar -xjf qwen.tar.bz2
          New-Item -ItemType Directory -Force -Path models/qwen3-asr-0.6B/tokenizer | Out-Null
          Copy-Item sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25/*.onnx models/qwen3-asr-0.6B/
          Copy-Item sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25/tokenizer/* models/qwen3-asr-0.6B/tokenizer/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy sherpa-onnx sounddevice pystray pillow pyperclip pyinstaller

      - name: Read version from paths.py
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path paths.py -Pattern '^VERSION = ' | Select-Object -First 1
          if (-not $line) { throw "VERSION not found in paths.py" }
          $version = ($line.Line -split '"')[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=local-speak2text-$version" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version"

      # build.bat runs the gates, builds, and runs the frozen smoke check.
      # The smoke gate pins LOCALSPEAK2TEXT_CONFIG to the release folder's
      # shipped config (model_dir relative to the exe); pipeline's upward
      # fallback resolves it to the models/ downloaded above.
      - name: Build release
        shell: cmd
        run: build.bat norun nopause

      - name: Package zip
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.package }}"
          $dir = "release/$pkg"
          if (-not (Test-Path "$dir/local-speak2text.exe")) { throw "build produced no exe in $dir" }
          Compress-Archive -Path "$dir/*" -DestinationPath "release/$pkg-windows-x64.zip"
          Get-FileHash "release/$pkg-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $pkg-windows-x64.zip" } |
            Set-Content "release/$pkg-windows-x64.zip.sha256"
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package }}-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = "${{ steps.version.outputs.package }}"
          $notes = "Windows package: unpack and run ``local-speak2text.exe``. See README.md for usage."
          gh release create $tag "release/$pkg-windows-x64.zip" "release/$pkg-windows-x64.zip.sha256" `
            --title "$pkg" --notes $notes
